<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <style>
    .watch-ui {
      width: 35mm;
      height: 41mm;
      border-radius: 30%;
      background-color: #0f1524;
      font-size: 9px;
      font-weight: bold;
      line-height: 1.3;
      color: #fff;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .instagram-icon {
      display: flex;
      align-items: center;
      justify-content: start;
      margin-bottom: 6px;
      height: 30%;
      gap: 15px;
      border-bottom: #fff 1px solid;
    }

    .instagram-icon img {
      width: 25px;
      height: 25px;
      margin-left: 5px;
    }

    .instagram-icon span {
      font-size: 11px;
      font-weight: 600;
    }

    .message {
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      user-select: text; 
    }

    .reference-image {
      width: 35mm;
      height: 41mm;
      margin-top: 15px;
      border-radius: 30%;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <div class="watch-ui">
    <div class="instagram-icon">
      <!-- Font Awesome Instagram Icon -->
        <i class="fab fa-instagram"></i>
      </a>
      <span>Instagram</span>
    </div>
    <pre class="message">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas qui dignissimos non accusamus sint sapiente, similique commodi excepturi
    </pre>
  </div>

  <!-- Link to Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
